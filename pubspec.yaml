  strings: ^4.0.1
  timezone: ^0.11.1
  web_socket_channel: ^3.0.2
  xml: ^7.0.1


  
dev_dependencies:
  http: any
  lint_hard: ^8.0.1
  mockito: ^5.4.5
  pub_release: ^11.2.0
  pubspec_manager: ^4.0.1
  test: ^1.25.14
 
