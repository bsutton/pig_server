name: pigation
version: 3.0.3
description: Pigation Server - an irrigation system for the Raspberry Pi
repository: https://github.com/bsutton/pig_server
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  acme_client: ^1.3.0
  archive: ^4.0.7
  args: ^2.4.2
  collection: ^1.19.1
  cron: ^0.6.0
  dart_periphery: ^0.9.12
  date_time_format: ^2.0.1
  dcli: ^10.0.0
  dcli_core: ^10.0.0
  dnsolve: ^3.0.0
  fixed: ^6.1.1
  http_parser: ^4.1.2
  intl: ^0.20.2
  mime: ^2.0.0
  path: ^1.9.0
  pig_common: ^1.0.0

  pointycastle: ^4.0.0
  posix: ^6.0.1
  self: ^0.8.0
  settings_yaml: ^8.2.0
  shelf: ^1.4.1
  shelf_letsencrypt: ^2.0.1
  shelf_rate_limiter: ^1.0.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  
  shelf_web_socket: ^3.0.0
  # It is critical that this is set to 2.3.4+4 (not with no ^ as we must use the exact version)
